<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review Queue</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = { darkMode: 'class' };
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .suggestion-card del { color: #ef4444; }
        .suggestion-card ins { color: #22c55e; text-decoration: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <div class="container mx-auto p-4 md:p-8">
        <!-- Theme Toggler -->
        <div class="absolute top-4 right-4">
            <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM3.05 4.95a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zm12.495 10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM4.464 14.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414z"></path></svg>
            </button>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 md:p-8">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-2">Admin Review Queue</h1>
            <p class="text-gray-600 dark:text-gray-400 mb-6">Approve or reject suggestions for Success Criteria updates.</p>
            <a href="/" class="text-blue-500 dark:text-blue-400 hover:underline mb-6 block">&larr; Back to Report Generator</a>

            <div id="pending-list-container" class="space-y-4">
                <!-- Pending suggestions will be loaded here -->
            </div>
        </div>
    </div>

    <script>
        // --- Theme Toggler ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        const pendingListContainer = document.getElementById('pending-list-container');
        const API_PENDING_CRITERIA_URL = '/api/pending-criteria';
        const API_APPROVE_CRITERION_URL = '/api/approve-criterion';
        const API_REJECT_CRITERION_URL = '/api/reject-criterion';
        const API_APPROVE_NEW_CRITERION_URL = '/api/approve-new-criterion';

        document.addEventListener('DOMContentLoaded', async () => {
            pendingListContainer.innerHTML = `<div class="p-8 text-center"><div class="spinner inline-block"></div></div>`;
            try {
                const response = await fetch(API_PENDING_CRITERIA_URL);
                if (!response.ok) throw new Error('Failed to fetch pending items.');
                const data = await response.json();
                renderPendingList(data);
            } catch (error) {
                console.error('Error loading data:', error);
                pendingListContainer.innerHTML = `<p class="text-red-500">Could not load pending items.</p>`;
            }
        });

        function renderPendingList(data) {
            if (!data || data.length === 0) {
                pendingListContainer.innerHTML = '<p class="text-center text-gray-500 dark:text-gray-400 py-8">The review queue is empty. Great job!</p>';
                return;
            }
            let html = '';
            data.forEach(item => {
                if (item.use_case_id === null) {
                    let proposedUseCaseName = '', proposedProductName = '', proposedSuccessCriterion = '', proposedMeasurement = '';
                    try {
                        const originalData = JSON.parse(item.original_criterion);
                        proposedUseCaseName = originalData.ucn || 'N/A';
                        proposedProductName = originalData.pn || 'N/A';
                        
                        const suggestedData = JSON.parse(item.suggested_criterion);
                        proposedSuccessCriterion = suggestedData.sc || 'N/A';
                        proposedMeasurement = suggestedData.m || 'N/A';
                    } catch (e) { console.error("Error parsing JSON for new proposal:", item, e); }

                    html += `
                        <div class="suggestion-card border border-blue-300 dark:border-blue-700 rounded-lg p-4 bg-blue-50 dark:bg-gray-800" id="pending-item-${item.pending_id}">
                            <div class="font-semibold text-gray-800 dark:text-gray-200 mb-1">New Criterion Proposal</div>
                            <div class="grid grid-cols-2 gap-x-4 gap-y-1 text-sm">
                                <strong class="text-gray-600 dark:text-gray-400">Use Case:</strong> <span class="dark:text-gray-300">${proposedUseCaseName}</span>
                                <strong class="text-gray-600 dark:text-gray-400">Product:</strong> <span class="dark:text-gray-300">${proposedProductName}</span>
                            </div>
                            <div class="mt-2 p-2 bg-white dark:bg-gray-700 rounded border border-gray-200 dark:border-gray-600">
                                <p class="text-xs text-gray-500 dark:text-gray-400">Proposed Success Criterion:</p>
                                <p class="text-sm dark:text-gray-300">${proposedSuccessCriterion}</p>
                            </div>
                            <div class="mt-1 p-2 bg-white dark:bg-gray-700 rounded border border-gray-200 dark:border-gray-600">
                                <p class="text-xs text-gray-500 dark:text-gray-400">Proposed Measurement:</p>
                                <p class="text-sm dark:text-gray-300">${proposedMeasurement}</p>
                            </div>
                            <div class="mt-4 flex justify-end space-x-2">
                                 <button class="reject-btn bg-red-600 text-white font-bold py-2 px-4 rounded-md hover:bg-red-700"
                                         data-pending-id="${item.pending_id}">Reject</button>
                                 <button class="approve-btn bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700" 
                                         data-pending-id="${item.pending_id}" data-proposal-type="new"
                                         data-use-case-name="${encodeURIComponent(proposedUseCaseName)}" data-product-name="${encodeURIComponent(proposedProductName)}"
                                         data-success-criterion="${encodeURIComponent(proposedSuccessCriterion)}" data-measurement="${encodeURIComponent(proposedMeasurement)}">Approve New</button>
                            </div>
                        </div>`;
                } else {
                    html += `
                        <div class="suggestion-card border border-gray-200 dark:border-gray-700 rounded-lg p-4 bg-white dark:bg-gray-800" id="pending-item-${item.pending_id}">
                            <div class="font-semibold text-gray-800 dark:text-gray-200">${item.UseCase} (${item.Product})</div>
                            <div class="mt-2 p-2 bg-gray-50 dark:bg-gray-700 rounded"><p class="text-sm text-gray-500 dark:text-gray-400">Original:</p><del>${item.original_criterion || '<em>(empty)</em>'}</del></div>
                            <div class="mt-1 p-2 bg-green-50 dark:bg-green-900/50 rounded"><p class="text-sm text-gray-500 dark:text-gray-400">Suggested:</p><ins>${item.suggested_criterion}</ins></div>
                            <div class="mt-4 flex justify-end space-x-2">
                                 <button class="reject-btn bg-red-600 text-white font-bold py-2 px-4 rounded-md hover:bg-red-700"
                                         data-pending-id="${item.pending_id}">Reject</button>
                                 <button class="approve-btn bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700" data-pending-id="${item.pending_id}" data-use-case-id="${item.use_case_id}" data-suggested-criterion="${encodeURIComponent(item.suggested_criterion)}" data-proposal-type="update">Approve Update</button>
                            </div>
                        </div>`;
                }
            });
            pendingListContainer.innerHTML = html;
        }

        pendingListContainer.addEventListener('click', async (event) => {
            const button = event.target.closest('.approve-btn, .reject-btn');
            if (!button) return;
            
            const isApprove = button.classList.contains('approve-btn');
            const { pendingId } = button.dataset;

            button.innerHTML = `<div class="spinner"></div>`;
            button.disabled = true;

            try {
                let response, payload, apiUrl;

                if (isApprove) {
                    const { proposalType } = button.dataset;
                    if (proposalType === 'new') {
                        apiUrl = API_APPROVE_NEW_CRITERION_URL;
                        payload = {
                            pending_id: parseInt(pendingId),
                            useCaseName: decodeURIComponent(button.dataset.useCaseName),
                            productName: decodeURIComponent(button.dataset.productName),
                            successCriterion: decodeURIComponent(button.dataset.successCriterion),
                            measurement: decodeURIComponent(button.dataset.measurement)
                        };
                    } else {
                        apiUrl = API_APPROVE_CRITERION_URL;
                        payload = {
                            pending_id: parseInt(pendingId),
                            use_case_id: parseInt(button.dataset.useCaseId),
                            suggested_criterion: decodeURIComponent(button.dataset.suggestedCriterion)
                        };
                    }
                } else {
                    if (!confirm('Are you sure you want to reject this suggestion? This cannot be undone.')) {
                        button.innerHTML = 'Reject';
                        button.disabled = false;
                        return;
                    }
                    apiUrl = API_REJECT_CRITERION_URL;
                    payload = { pending_id: parseInt(pendingId) };
                }

                response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Action failed with status ${response.status}. Response: ${errorText}`);
                }

                const result = await response.json();

                if (result.success) {
                    const itemToRemove = document.getElementById(`pending-item-${pendingId}`);
                    if (itemToRemove) itemToRemove.remove();
                    if (pendingListContainer.children.length === 0) renderPendingList([]);
                } else {
                    throw new Error(result.error || 'Action failed');
                }
            } catch(error) {
                console.error('Action error:', error);
                alert(error.message || 'Failed to perform action.');
                if (isApprove) {
                    const { proposalType } = button.dataset;
                    button.innerHTML = proposalType === 'new' ? 'Approve New' : 'Approve Update';
                } else {
                    button.innerHTML = 'Reject';
                }
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
