<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Use Case Report Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/choices.js/public/assets/styles/choices.min.css" />
    <script>
        // Configure Tailwind to use class-based dark mode
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .report-table {
            border-collapse: collapse;
            width: 100%;
        }
        .report-table th, .report-table td {
            border: 1px solid #d1d5db; /* Light mode border */
            padding: 12px;
            text-align: left;
        }
        html.dark .report-table th, html.dark .report-table td {
            border-color: #4b5563; /* Dark mode border */
        }
        .report-table th {
            background-color: #f9a825;
            font-weight: 600;
            color: #1f2937;
            text-align: center;
        }
        .report-table .notes-row {
            background-color: #f3f4f6; /* Light mode */
        }
        html.dark .report-table .notes-row {
            background-color: #374151; /* Dark mode */
        }
        .report-table .notes-label {
            font-weight: bold;
        }
        .report-table .merged-cell {
            vertical-align: top;
        }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid #3498db; border-radius: 50%; width: 16px; height: 16px; animation: spin 1s linear infinite; display: inline-block; margin-right: 8px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- Choices.js Dark Mode Styles --- */
        html.dark .choices__inner {
            background-color: #374151;
            border-color: #4b5563;
            color: #d1d5db;
        }
        html.dark .choices__list--dropdown, html.dark .choices__list[aria-expanded] {
            background-color: #374151;
            border-color: #4b5563;
        }
        html.dark .choices__list--dropdown .choices__item--selectable.is-highlighted {
            background-color: #4b5563;
        }
        html.dark .choices__list--multiple .choices__item {
            background-color: #4b5563;
            border-color: #6b7280;
        }
        html.dark .choices[data-type*="select-multiple"] .choices__button, html.dark .choices[data-type*="text"] .choices__button {
            border-left-color: #4b5563;
        }
        
        @media print {
            body * {
                visibility: hidden;
            }
            .print-area, .print-area * {
                visibility: visible;
            }
            .print-area {
                position: absolute;
                left: 0;
                top: 0;
                width: 100%;
            }
            .no-print {
                display: none;
            }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200 transition-colors duration-300">

    <div class="container mx-auto p-4 md:p-8">
        <div class="absolute top-4 right-4 no-print">
            <button id="theme-toggle" type="button" class="text-gray-500 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700 focus:outline-none focus:ring-4 focus:ring-gray-200 dark:focus:ring-gray-700 rounded-lg text-sm p-2.5">
                <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20" xmlns="http://www.w3.org/2000/svg"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM10 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM3.05 4.95a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zm12.495 10.607a1 1 0 010 1.414l-.707.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM4.464 14.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414z"></path></svg>
            </button>
        </div>

        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-lg p-6 md:p-8 no-print">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-900 dark:text-white mb-4">Use Case Report Generator</h1>
            <p class="text-gray-600 dark:text-gray-400 mb-6">Select one or more Use Cases and/or Products to generate a formatted report.</p>
            
            <div class="mb-6">
                <a href="/update.html" 
                   class="inline-block bg-teal-600 text-white font-bold py-2 px-4 rounded-md hover:bg-teal-700 transition duration-300">
                   Manage Success Criteria
                </a>
                <a href="/admin.html" 
                   class="ml-2 inline-block bg-orange-500 text-white font-bold py-2 px-4 rounded-md hover:bg-orange-600 transition duration-300">
                   Admin Review Queue
                </a>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                <div>
                    <label for="useCaseFilter" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Use Case(s)</label>
                    <select id="useCaseFilter" multiple></select>
                </div>
                <div>
                    <label for="productFilter" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Product(s)</label>
                    <select id="productFilter" multiple></select>
                </div>
            </div>
            <div class="flex flex-col md:flex-row items-center space-y-2 md:space-y-0 md:space-x-2 mt-4">
                <button id="generateBtn" class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-md hover:bg-blue-700 transition duration-300">
                    Generate
                </button>
                <button id="copyBtn" class="w-full bg-green-600 text-white font-bold py-2 px-4 rounded-md hover:bg-green-700 transition duration-300 hidden">
                    Copy
                </button>
                <button id="printBtn" class="w-full bg-gray-700 text-white font-bold py-2 px-4 rounded-md hover:bg-gray-800 transition duration-300 hidden">
                    Print
                </button>
                <button id="downloadPocBtn" class="w-full bg-purple-600 text-white font-bold py-2 px-4 rounded-md hover:bg-purple-700 transition duration-300 hidden flex items-center justify-center">
                    Download PoC
                </button>
            </div>
            <div id="loading" class="text-center p-4 hidden">
                <p>Loading...</p>
            </div>
        </div>

        <div id="outputContainer" class="mt-8 bg-white dark:bg-gray-800 rounded-lg shadow-lg print-area">
            </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/choices.js/public/assets/scripts/choices.min.js"></script>
    <script>
        // --- Theme Toggler ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        // Check theme on initial load
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            lightIcon.classList.remove('hidden');
        } else {
            document.documentElement.classList.remove('dark');
            darkIcon.classList.remove('hidden');
        }

        themeToggleBtn.addEventListener('click', () => {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (localStorage.getItem('color-theme')) {
                if (localStorage.getItem('color-theme') === 'light') {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                }
            } else {
                if (document.documentElement.classList.contains('dark')) {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('color-theme', 'light');
                } else {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('color-theme', 'dark');
                }
            }
        });

        // --- Element References ---
        const useCaseFilter = document.getElementById('useCaseFilter');
        const productFilter = document.getElementById('productFilter');
        const generateBtn = document.getElementById('generateBtn');
        const printBtn = document.getElementById('printBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadPocBtn = document.getElementById('downloadPocBtn');
        const outputContainer = document.getElementById('outputContainer');
        const loadingDiv = document.getElementById('loading');
        
        // --- API URLs ---
        const API_FILTERS_URL = '/api/filters';
        const API_USECASES_URL = '/api/usecases';
        const API_GENERATE_POC_URL = '/api/generate-poc-document';

        // --- Choices.js Instances & Data Store ---
        let useCaseChoices, productChoices;
        let lastFilteredData = []; // Store the last fetched data

        // --- Event Listeners ---
        document.addEventListener('DOMContentLoaded', () => {
            useCaseChoices = new Choices(useCaseFilter, { removeItemButton: true, placeholder: true, placeholderValue: 'Select or type to search...' });
            productChoices = new Choices(productFilter, { removeItemButton: true, placeholder: true, placeholderValue: 'Select or type to search...' });
            populateFilters();
        });
        
        generateBtn.addEventListener('click', generateReport);
        printBtn.addEventListener('click', () => window.print());
        copyBtn.addEventListener('click', copyReportToClipboard);
        downloadPocBtn.addEventListener('click', downloadPocDocument);

        async function populateFilters() {
            try {
                const response = await fetch(API_FILTERS_URL);
                if (!response.ok) throw new Error('Failed to fetch filter data.');
                const data = await response.json();
                
                const useCaseItems = data.useCases.map(uc => ({ value: uc.UseCase, label: uc.UseCase }));
                useCaseChoices.setChoices(useCaseItems, 'value', 'label', true);

                const productSet = new Set();
                data.products.forEach(p => {
                    p.Product.split(';').forEach(indivP => {
                        const trimmedP = indivP.trim();
                        if (trimmedP) productSet.add(trimmedP);
                    });
                });

                const sortedProducts = Array.from(productSet).sort();
                const productItems = sortedProducts.map(p => ({ value: p, label: p }));
                productChoices.setChoices(productItems, 'value', 'label', true);

            } catch (error) {
                console.error('Error populating filters:', error);
                outputContainer.innerHTML = `<p class="text-red-500 p-4">Error loading initial data. Is the Worker running?</p>`;
            }
        }
        
        async function generateReport() {
            const selectedUseCases = useCaseChoices.getValue(true);
            const selectedProducts = productChoices.getValue(true);

            if (selectedUseCases.length === 0 && selectedProducts.length === 0) {
                 outputContainer.innerHTML = `<p class="p-8 text-center text-gray-500 dark:text-gray-400">Please select at least one Use Case or Product to generate a report.</p>`;
                 return;
            }

            loadingDiv.classList.remove('hidden');
            outputContainer.innerHTML = '';
            printBtn.classList.add('hidden');
            copyBtn.classList.add('hidden');
            downloadPocBtn.classList.add('hidden');
            lastFilteredData = []; // Clear previous data

            try {
                const url = new URL(API_USECASES_URL, window.location.origin);
                const response = await fetch(url);
                if (!response.ok) throw new Error('Failed to fetch report data.');
                
                const allData = await response.json();

                const filteredData = allData.filter(item => {
                    const useCaseMatch = selectedUseCases.length === 0 || selectedUseCases.includes(item.UseCase);
                    const itemProducts = item.Product.split(';').map(p => p.trim());
                    const productMatch = selectedProducts.length === 0 || selectedProducts.some(selectedP => itemProducts.includes(selectedP));
                    return useCaseMatch && productMatch;
                });
                
                lastFilteredData = filteredData; // Store data for other functions
                renderTable(filteredData);

                if(filteredData.length > 0) {
                    printBtn.classList.remove('hidden');
                    copyBtn.classList.remove('hidden');
                    downloadPocBtn.classList.remove('hidden');
                }

            } catch (error) {
                console.error('Error generating report:', error);
                outputContainer.innerHTML = `<p class="text-red-500 p-4">Could not generate the report. Please try again.</p>`;
            } finally {
                loadingDiv.classList.add('hidden');
            }
        }

        async function downloadPocDocument() {
            if (lastFilteredData.length === 0) {
                alert("No data available to generate a document. Please generate a report first.");
                return;
            }

            const originalButtonContent = downloadPocBtn.innerHTML;
            downloadPocBtn.innerHTML = `<span class="spinner"></span>Generating...`;
            downloadPocBtn.disabled = true;

            try {
                const response = await fetch(API_GENERATE_POC_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(lastFilteredData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || 'Failed to generate document on the server.');
                }
                
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                // Get filename from response header, or use a default
                const contentDisposition = response.headers.get('content-disposition');
                let filename = "Proof_of_Concept_Plan.docx";
                if (contentDisposition && contentDisposition.indexOf('attachment') !== -1) {
                    const filenameRegex = /filename[^;=\n]*=((['"]).*?\2|[^;\n]*)/;
                    const matches = filenameRegex.exec(contentDisposition);
                    if (matches != null && matches[1]) {
                        filename = matches[1].replace(/['"]/g, '');
                    }
                }
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

            } catch(error) {
                console.error("Error downloading PoC document:", error);
                alert("An error occurred while generating the document: " + error.message);
            } finally {
                downloadPocBtn.innerHTML = originalButtonContent;
                downloadPocBtn.disabled = false;
            }
        }


        function copyReportToClipboard() {
            const reportTable = outputContainer.querySelector('.report-table');
            if (!reportTable) return;

            const clone = reportTable.cloneNode(true);
            const tempContainer = document.createElement('div');
            tempContainer.style.position = 'absolute';
            tempContainer.style.left = '-9999px'; 
            document.body.appendChild(tempContainer);
            tempContainer.appendChild(clone);

            clone.style.width = '100%';
            clone.style.tableLayout = 'fixed';
            clone.style.color = 'black';
            clone.style.backgroundColor = 'white';
            clone.style.writingMode = 'horizontal-tb';

            const allCells = clone.querySelectorAll('td, th');
            allCells.forEach(cell => {
                cell.style.color = 'black';
                cell.style.backgroundColor = 'white';
                cell.style.writingMode = 'horizontal-tb';
                cell.style.wordWrap = 'break-word';
                cell.style.fontWeight = 'normal';
            });

            const headerCells = clone.querySelectorAll('th');
            if (headerCells.length === 5) {
                headerCells[0].style.width = '20%'; // Use Case
                headerCells[1].style.width = '15%'; // Product
                headerCells[2].style.width = '30%'; // Success Criteria
                headerCells[3].style.width = '25%'; // Measurement
                headerCells[4].style.width = '10%'; // Outcome
            }
            
            const outcomeCells = clone.querySelectorAll('.outcome-cell');
            outcomeCells.forEach(cell => { cell.style.width = ''; });

            headerCells.forEach(th => {
                th.style.backgroundColor = '#f9a825';
                th.style.color = '#1f2937';
                th.style.fontWeight = 'bold';
            });
            
            const notesLabels = clone.querySelectorAll('.notes-label');
            notesLabels.forEach(label => { label.style.fontWeight = 'bold'; });

            const notesRows = clone.querySelectorAll('.notes-row');
            notesRows.forEach(row => {
                const notesCells = row.querySelectorAll('td');
                notesCells.forEach(cell => { cell.style.backgroundColor = '#f3f4f6'; });
            });

            const range = document.createRange();
            range.selectNode(clone);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);

            try {
                const successful = document.execCommand('copy');
                if (successful) {
                    const originalText = copyBtn.textContent;
                    copyBtn.textContent = 'Copied!';
                    setTimeout(() => { copyBtn.textContent = originalText; }, 2000);
                } else {
                    alert('Copy command was not successful. Please copy manually.');
                }
            } catch (err) {
                console.error('Failed to copy text: ', err);
                alert('Failed to copy. Please try again or copy manually.');
            }

            window.getSelection().removeAllRanges();
            document.body.removeChild(tempContainer);
        }

        function renderTable(data) {
            if (!data || data.length === 0) {
                outputContainer.innerHTML = `<p class="p-8 text-center text-gray-500 dark:text-gray-400">No use cases found for the selected criteria.</p>`;
                return;
            }

            const groupedData = data.reduce((acc, item) => {
                const key = `${item.UseCase}|${item.Product}`;
                if (!acc[key]) {
                    acc[key] = { useCase: item.UseCase, product: item.Product, criteria: [] };
                }
                acc[key].criteria.push({ successCriterion: item.SuccessCriterion, measurement: item.Measurement });
                return acc;
            }, {});

            let tableHTML = `<table class="report-table"><thead><tr><th>Use Case</th><th>Product</th><th>Success Criteria</th><th>Measurement</th><th>Outcome</th></tr></thead><tbody>`;
            
            for (const key in groupedData) {
                const group = groupedData[key];
                const totalRows = group.criteria.length * 2; 

                group.criteria.forEach((item, index) => {
                    tableHTML += `<tr>`;
                    if (index === 0) {
                        tableHTML += `<td rowspan="${totalRows}" class="merged-cell">${group.useCase}</td>`;
                        tableHTML += `<td rowspan="${totalRows}" class="merged-cell">${group.product}</td>`;
                    }
                    tableHTML += `
                        <td>${item.successCriterion}</td>
                        <td>${item.measurement}</td>
                        <td class="outcome-cell" style="width: 150px;">
                            <label class="flex items-center space-x-2"><input type="checkbox" class="h-4 w-4 rounded bg-gray-200 dark:bg-gray-600 border-gray-300 dark:border-gray-500"><span>Pass</span></label>
							<label class="flex items-center space-x-2"><input type="checkbox" class="h-4 w-4 rounded bg-gray-200 dark:bg-gray-600 border-gray-300 dark:border-gray-500"><span>Fail</span></label>
                        </td>
                    </tr>
                    <tr class="notes-row">
                        <td class="notes-label">Notes:</td>
                        <td></td>
                    </tr>`;
                });
            }

            tableHTML += `</tbody></table>`;
            outputContainer.innerHTML = tableHTML;
        }
    </script>
</body>
</html>
